name: Revisar vigencia de R6Calls
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Consultar solo la metadata de revisiones
        run: python3 tools/check_sources.py
      - name: Registrar aviso de revisión sin instalar datos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/source_review_issue.py
      - name: Conservar el estado de revisión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar revisión semanal de la fuente de mapas"
            git push
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Construir web sin sustituir mapas instalados
        run: |
          python3 -m pip install Pillow==12.3.0
          node --test tests/*.test.cjs
          python3 tools/build_site.py
          python3 tools/optimize_maps.py
          python3 tools/release_check.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
